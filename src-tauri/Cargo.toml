[package]
name = "sysforge"
version = "1.0.0"
description = "SysForge - Modular Sysadmin/Developer/Security Toolkit"
authors = ["SysForge"]
edition = "2021"

[lib]
name = "sysforge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
# Part A: API Key Encryption
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Part L: PTY Terminal
portable-pty = "0.8"
dirs = "5"
# Part N/O/K: File scanning
blake3 = "1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
