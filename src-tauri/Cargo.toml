[package]
name = "sysforge"
version = "1.0.0"
description = "SysForge - Modular Sysadmin/Developer/Security Toolkit"
authors = ["SysForge"]
edition = "2021"

[lib]
name = "sysforge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
